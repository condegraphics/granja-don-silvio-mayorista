name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R img fonts _site/
          touch _site/.nojekyll

      # Esta maqueta duplica la seccion publicada en el dominio real.
      # El noindex se inyecta SOLO en el artifact: el repo queda intacto
      # porque tambien alimenta https://lagranjadonsilvio.com/mayorista/
      - name: Marcar maqueta como noindex (solo artifact de Pages)
        run: |
          perl -0pi -e 's{<head(\s[^>]*)?>}{$&\n  <meta name="robots" content="noindex, nofollow">}i' _site/index.html
          printf '%s\n' \
            '# Maqueta de staging: la version oficial vive en lagranjadonsilvio.com/mayorista/' \
            'User-agent: *' \
            'Allow: /' \
            'User-agent: GPTBot' 'Disallow: /' \
            'User-agent: OAI-SearchBot' 'Disallow: /' \
            'User-agent: ClaudeBot' 'Disallow: /' \
            'User-agent: PerplexityBot' 'Disallow: /' \
            'User-agent: Google-Extended' 'Disallow: /' \
            'User-agent: CCBot' 'Disallow: /' > _site/robots.txt
          grep -o 'name="robots" content="[^"]*"' _site/index.html

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
